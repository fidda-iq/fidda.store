<style id="fidda-status-final">
/* الحالة في المتجر: خلفية بيضاء + لون كامل للمستطيل والنص + حواف دائرية */
.fidda-store-availability {
  display:inline-flex !important;
  align-items:center;
  justify-content:center;
  padding:5px 13px !important;
  border-radius:999px !important;
  font-weight:700 !important;
  line-height:1.2;
  background:#fff !important;
  border:1px solid currentColor !important;
}
.fidda-store-availability.available {
  color:#25a85a !important;
  background:rgba(37,168,90,.12) !important;
}
.fidda-store-availability.unavailable {
  color:#d83b3b !important;
  background:rgba(216,59,59,.10) !important;
}

/* الأكثر اختياراً: المستطيل بلا لون، لون النص فقط */
.fidda-popular-availability {
  display:inline-flex !important;
  align-items:center;
  justify-content:center;
  padding:5px 13px !important;
  border-radius:999px !important;
  font-weight:700 !important;
  line-height:1.2;
  background:transparent !important;
  border:1px solid currentColor !important;
}
.fidda-popular-availability.available {
  color:#25a85a !important;
  background:transparent !important;
}
.fidda-popular-availability.unavailable {
  color:#d83b3b !important;
  background:transparent !important;
}

/* الأقسام الفارغة */
.fidda-coming-soon {
  width:100%;
  min-height:280px;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  text-align:center !important;
  margin:0 auto !important;
  padding:40px 20px !important;
  box-sizing:border-box !important;
  font-size:clamp(22px,3vw,32px) !important;
  font-weight:700 !important;
}
@media (max-width:600px){
  .fidda-coming-soon {
    min-height:220px;
    font-size:23px !important;
  }
}
</style>
